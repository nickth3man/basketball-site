# Dependabot Configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ============================================
  # NPM Dependencies
  # ============================================
  - package-ecosystem: 'npm'
    directory: '/nba-reference'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'nickth3man'
    assignees:
      - 'nickth3man'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      # Group patch and minor updates together
      patch-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Separate group for major updates (breaking changes)
      major:
        patterns:
          - '*'
        update-types:
          - 'major'

  # ============================================
  # GitHub Actions
  # ============================================
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'nickth3man'
    assignees:
      - 'nickth3man'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
